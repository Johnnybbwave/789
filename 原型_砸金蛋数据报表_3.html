    <span style="text-align:right;color:#555">活动状态</span><div style="display:flex;align-items:center;gap:8px">${sw(true).replace('#ff6b6b', '#1677ff')}<span style="color:#666">已开启 · 玩家端可见</span></div>
    ${lab('活动优先级', 1, 'cfg-prio')}<div style="display:flex;align-items:center;gap:8px;grid-column:span 3"><input id="cfg-prio" value="1" style="border:1px solid #d9d9d9;padding:6px 10px;font-size:12px;width:80px"><span style="color:#888;font-size:11px">数字越小优先级越高；用户同时命中多个砸金蛋活动时，仅进入优先级最高的一个</span></div></div>`)}
  ${card('时间配置', '', `<div style="display:grid;grid-template-columns:100px 1fr;gap:14px 12px;align-items:center">
    ${lab('活动时间', 1, 'cfg-t1')}${range('cfg-t1', '2026-10-01 00:00', '2026-10-31 23:59')}
    ${lab('活动展示时间', 0, 'cfg-t2')}<div style="display:flex;align-items:center;gap:10px">${range('cfg-t2', '2026-10-01 00:00', '2026-10-31 23:59')}<span style="color:#888;font-size:11px">ⓘ 展示时间独立于持续时间：可「已结束但仍展示」（返场露出），也可「已开始但先不展示」；未配置时回落为持续时间</span></div></div>`)}
  ${card('目标人群与任务命中', '两步决定一位玩家的活动体验：① 谁能参与 → ② 名单微调。', `
    <div style="background:#fafafa;border:1px solid #f0f0f0;border-radius:4px;padding:12px 14px;margin-bottom:12px">
      <div style="font-weight:600;margin-bottom:4px">① 谁能参与 · 进入门槛</div>
      <div style="color:#888;font-size:11px;margin-bottom:12px">先按资格状态（KYC/首充/首投）圈定人群，再叠加数值门槛；开启的条件需同时满足，关闭即不限制。</div>
      <div style="display:grid;grid-template-columns:90px 1fr;gap:10px 12px;align-items:center;margin-bottom:12px">
        <span style="text-align:right;color:#555">有无 KYC</span>${seg3(['未 KYC', '已 KYC', '不限'], 1)}
        <span style="text-align:right;color:#555">有无首充</span>${seg3(['未首充', '已首充', '不限'], 0)}
        <span style="text-align:right;color:#555">有无首投</span>${seg3(['未首投', '已首投', '不限'], 2)}</div>
      <div style="display:grid;grid-template-columns:40px 110px 120px 130px 1fr;gap:8px;align-items:center">
        ${thr(1, '累计充值次数', 1, '次')}${thr(1, '累计充值金额', 100, '₱')}${thr(0, '累计投注金额', 0, '₱')}${thr(0, '连续投注天数', 3, '天 <span style="border:1px solid #e5e5e5;padding:0 4px;color:#999;font-size:11px">待接入</span>')}${thr(0, '连续登录天数', 0, '天')}</div></div>
    <div style="background:#fafafa;border:1px solid #f0f0f0;border-radius:4px;padding:12px 14px">
      <div style="font-weight:600;margin-bottom:10px">② 名单微调（黑 / 白名单）</div>
      ${list('白名单', '#91caff', '#e6f4ff', '#1677ff', '#52c41a')}${list('黑名单', '#ffa39e', '#fff1f0', '#cf1322', '#ff4d4f')}
      <div style="color:#888;font-size:11px">白名单强制纳入（忽略门槛）、黑名单强制排除。批量导入只支持 .csv / .txt。</div></div>`)}
  ${card('活动 Banner', '在富文本编辑器中上传 Banner 图片，再插入倒计时并拖到图片上的位置。PC 与移动端共用；倒计时截止时间 = 活动结束时间，样式从预设中选择。', `
    <div style="max-width:760px;margin-left:11px;border:1px solid #d9d9d9;background:#fff">
      <div style="display:flex;align-items:center;gap:4px;padding:6px 8px;background:#fafafa;border-bottom:1px solid #e8e8e8">
        <label style="cursor:pointer;padding:3px 8px;border:1px solid #d9d9d9;background:#fff">🖼 图片<input type="file" accept="image/png,image/jpeg,image/webp" onchange="loadImg(this.files[0])" style="position:absolute;width:1px;height:1px;opacity:0"></label>
        <button type="button" onclick="cdToggle()" ${cfg.img ? '' : 'disabled'} title="先上传图片再插入倒计时" style="font:inherit;cursor:pointer;padding:3px 8px;border:1px solid ${cdOn ? '#1677ff' : '#d9d9d9'};background:${cdOn ? '#e6f4ff' : '#fff'};color:${cfg.img ? (cdOn ? '#1677ff' : '#333') : '#bbb'}">⏱ ${cdOn ? '移除倒计时' : '插入倒计时'}</button></div>
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px;border-bottom:1px solid #e8e8e8"><span style="color:#555;margin-right:2px">倒计时样式</span>
        ${presets.map(x => `<button type="button" onclick="cdPick('${x.k}')" aria-pressed="${x.k === cfg.cdStyle}" style="font:inherit;cursor:pointer;padding:7px 10px 5px;border:2px solid ${x.k === cfg.cdStyle ? '#1677ff' : 'transparent'};border-radius:6px;background:#2a1260;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:92px"><span style="display:inline-flex;align-items:center;white-space:nowrap;font-size:11px;${x.wrap}">${segHtml(x)}</span><span style="color:#fff;font-size:11px">${x.name}</span></button>`).join('')}</div>
      <div ondragover="cfgOver(event)" ondragleave="cfgLeave()" ondrop="cfgDrop(event)" style="padding:12px;min-height:200px;outline:${cfg.over ? '2px dashed #1677ff' : 'none'};outline-offset:-4px">
        ${cfg.img ? `<div style="position:relative;width:100%"><img src="${cfg.img.url}" alt="活动 Banner" draggable="false" style="display:block;width:100%;border-radius:8px;user-select:none">${cdOn ? `<div onpointerdown="cdDown(event)" title="拖动调整位置" style="position:absolute;left:${cfg.x}%;top:${cfg.y}%;cursor:move;user-select:none;touch-action:none;display:inline-flex;align-items:center;white-space:nowrap;font-size:18px;letter-spacing:1px;outline:1px dashed #1677ff;outline-offset:3px;${p.wrap}">${segHtml(p)}</div>` : ''}</div>`
          : `<div style="height:200px;border:1px dashed #d9d9d9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#888;pointer-events:none"><span style="font-size:13px">点工具栏「图片」上传，或把图片拖到这里</span><span style="font-size:11px">JPG / PNG / WebP，≤ 2MB</span></div>`}</div>
      <div style="padding:5px 10px;border-top:1px solid #f0f0f0;color:#888;font-size:11px">图片：${cfg.img ? cfg.img.name : '未上传'}${cdOn ? ` · 倒计时位置：距左 ${cfg.x}% / 距顶 ${cfg.y}%` : ''}</div></div>`)}
  <div style="display:flex;gap:10px;border-top:1px solid #eee;padding-top:14px">${btn('保存配置', 'background:#1677ff;color:#fff;border:0;padding:6px 18px')}<button type="button" onclick="state.tab='report';render()" style="font:inherit;cursor:pointer;background:#fff;color:#333;border:1px solid #d9d9d9;padding:6px 18px">取消</button></div></div>`;
}

function alerts_all(){ for (let k=0;k<10;k++) state.closed[k]=1; render(); }
render();
</script></body></html>
