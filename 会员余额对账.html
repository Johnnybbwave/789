<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:#333;background:#f0f2f5}
.top{background:#1d5c6b;color:#fff;height:44px;display:flex;align-items:center;padding:0 18px;gap:12px;font-weight:600}
.top .tag{background:#f0a032;padding:2px 8px;border-radius:3px;font-size:12px}
.top .r{margin-left:auto;font-weight:400}
.layout{display:flex;min-height:calc(100vh - 44px)}
.side{width:200px;background:#fff;border-right:1px solid #e5e5e5;flex-shrink:0}
.side .h{background:#2a7a7a;color:#fff;padding:14px 20px;font-weight:700}
.side .g{padding:13px 20px;font-weight:600;border-bottom:1px solid #f0f0f0;background:#fafafa}
.side .i{padding:11px 20px 11px 36px;color:#444}
.side .i.on{background:#1e6e66;color:#fff;font-weight:700}
.new{background:#e74c3c;color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;margin-left:4px;font-weight:600}
.main{flex:1;padding:14px 16px;min-width:0}
.crumb{color:#666;margin-bottom:12px}
.card{background:#fff;border:1px solid #e6e6e6;border-radius:4px;padding:14px 16px;margin-bottom:14px}
.ptabs{display:flex;gap:28px;border-bottom:1px solid #e6e6e6;margin-bottom:14px;align-items:flex-end}
.ptabs button{background:none;border:0;padding:6px 0 10px;font-size:14px;cursor:pointer;color:#333;border-bottom:2px solid transparent}
.ptabs button.on{color:#1e6e66;font-weight:700;border-color:#1e6e66}
.ptabs .hint{margin-left:auto;color:#888;font-size:12px;padding-bottom:10px}
.bar1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar1 input[type=date]{border:1px solid #dcdfe6;border-radius:3px;padding:6px 8px;font-size:13px}
.btn{background:#fff;color:#333;border:1px solid #dcdfe6;border-radius:3px;padding:7px 14px;cursor:pointer;font-size:12px}
.btn.pri{background:#e8f3f1;color:#1e6e66;border-color:#9fcfc6;font-weight:600}
.seg{display:flex}.seg button{border:1px solid #dcdfe6;background:#fff;padding:7px 12px;cursor:pointer;font-size:12px;margin-left:-1px}
.seg button.on{background:#1e6e66;color:#fff;border-color:#1e6e66}
.right{margin-left:auto;display:flex;gap:8px}
.stat{margin:12px 0 10px;font-size:14px}
.stat .ok{color:#1f8a56;font-weight:700;margin-left:16px}.stat .bad{color:#d0352a;font-weight:700;margin-left:16px}
.warn{background:#fff7ec;border:1px solid #fde2bd;color:#d9822b;padding:9px 14px;border-radius:3px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1fr 2.2fr 1fr 1fr;gap:12px;margin-bottom:12px}
.kpi{border:1px solid #e6e6e6;border-radius:4px;padding:12px 14px}
.kpi .l{color:#888;font-size:12px}.kpi .v{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}.kpi .s{color:#999;font-size:12px;margin-top:3px}
.kpi.ok{border-color:#2e9e6a;background:#f2fbf6}.kpi.ok .v{color:#1f8a56}
.kpi.bad{border-color:#e74c3c;background:#fff4f3}.kpi.bad .v{color:#d0352a}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{background:#fafafa;color:#555;font-weight:600;padding:8px 5px;border-bottom:1px solid #ebeef5;font-size:12px;white-space:nowrap;line-height:1.4}
th small{display:block;color:#999;font-weight:400;font-size:10px}
td{padding:10px 5px;border-bottom:1px solid #ebeef5;text-align:center;white-space:nowrap}
td.l{text-align:left}
th.calc,td.calc{background:#f4f9fb}
tr.row{cursor:pointer}tr.row:hover td{background:#f7fbfa}
tr.abn td{background:#fdecec}
tr.pend td{color:#999;background:#f7f7f7}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:12px}
.b-ok{color:#1f8a56;background:#eefaf3;border:1px solid #bfe8cf}.b-bad{color:#d0352a;background:#fff;border:1px solid #f5b5ae}.b-run{color:#888;background:#f3f3f3;border:1px solid #ddd}
.dx{color:#d0352a;font-weight:700}
.arrow{display:inline-block;width:12px;color:#1e6e66;transition:transform .15s}
tr.open .arrow{transform:rotate(90deg)}
.detail>td{background:#fbfdfd;text-align:left;padding:14px 18px;white-space:normal}
.formula{background:#f5f8f8;border-left:3px solid #1e6e66;padding:9px 14px;line-height:1.9;margin-bottom:10px}
.formula b{color:#1e6e66}.p{color:#1f8a56}.m{color:#d0352a}
.steps{width:auto;min-width:760px}
.steps td,.steps th{text-align:right;padding:7px 12px;background:#fff}
.steps td.l,.steps th.l{text-align:left}
.steps tr.res td{background:#eef6f4;font-weight:700}
.steps .sub td{color:#888;font-size:12px}
.wbar{width:200px;height:9px;background:#e8eeee;border-radius:2px;position:relative}
.wbar i{position:absolute;top:0;height:9px;border-radius:2px}
.src{color:#999;font-size:12px}
.mt{margin-top:12px}.mt td,.mt th{padding:7px 8px;text-align:right;background:#fff}.mt td.l,.mt th.l{text-align:left}
.note{color:#888;font-size:12px;line-height:1.85}
</style>
</head>
<body>
<div class="top">当前时间: <span id="clock">2026/11/23 15:37:22</span> +08:00 <span class="tag">QA环境</span><span class="r">简体中文 · bd_johnny</span></div>
<div class="layout">
<aside class="side">
  <div class="h">菜单</div>
  <div class="g">用户管理</div>
  <div class="g">财务管理</div>
  <div class="i">财务总览</div>
  <div class="i">余额对账</div>
  <div class="i on">会员余额对账</div>
  <div class="i">充值记录</div><div class="i">提款记录</div><div class="i">资金明细</div><div class="i">修改余额审批</div>
  <div class="g">提现管理</div><div class="g">数据报表</div>
</aside>
<main class="main">
  <div class="crumb">位置 › 财务管理 › 会员余额对账</div>
  <div class="card">
    <div class="bar1">
      <input id="q" placeholder="会员账号" style="border:1px solid #dcdfe6;border-radius:3px;padding:7px 10px;width:180px;font-size:13px">
      日期 <input type="date" id="d1" value="2026-11-23" min="2026-10-24" max="2026-11-23"> <span class="src">仅可查最近 31 天，按单日查询</span>
      <label><input type="checkbox" id="onlyBad"> 只看异常</label>
      <button class="btn pri" onclick="render()">搜索</button>
      <button class="btn pri" id="exp" onclick="exportCsv()">导出</button>
      <div class="right" style="align-items:center;color:#666;font-size:12px">最近统计时间：<b id="lastStat" style="color:#333"></b><span class="src" id="nextRef" style="margin-left:6px"></span><button class="btn" onclick="refreshStat()">刷新</button></div>
    </div>
    <div class="seg" id="quick" style="margin-top:12px"><button data-r="2026-11-23" class="on">今日</button><button data-r="2026-11-22">昨日</button></div>
    <div class="stat" id="stat"></div>
    <div id="warn"></div>
    <div class="kpis" id="kpis"></div>
    <div class="scroll"><table id="tbl"></table></div>
  </div>
</main>
<script>
const r2=x=>Math.round(x*100)/100;
function theo(r){return r.open+r.rech+r.add+r.bAct+r.bRech-r.wd-r.ded-r.fee-r.profit}
const MEMBERS=[['Player31nmz0012',''],['Playerjh2hh6768','NEKKA DIAZ MEREGILDO'],['Playerryekf6936','NEKKA DIAZ MEREGILDO'],['Playerkuujg2584','ANGELA LIM FLORES'],['Playerab9x1123','MARK REYES']];
// open,rech,add,bAct,bRech,wd,ded,fee,profit
const TODAY=[[200000,6000000,50000,400000,100000,3000000,30000,20000,3000000],[300000,5000000,0,500000,100000,4000000,0,0,900000],[100000,4000000,0,300000,100000,1000000,0,0,2500000],[250000,3000000,0,250000,50000,2000000,0,0,1000000],[150000,2000000,0,150000,50000,0,0,0,600000]];
const YDAY=[[100000,800000,0,80000,5000,400000,0,3000,382000],[150000,700000,50000,70000,5000,300000,10000,4000,361000],[120000,500000,0,50000,4000,200000,0,2000,372000],[130000,600000,0,60000,3000,300000,0,3000,240000],[100000,400000,0,40000,3000,300000,0,3000,90000]];
const K=['open','rech','add','bAct','bRech','wd','ded','fee','profit','bet','payout'];
const obj=(a,date)=>{const o={date};K.forEach((k,i)=>o[k]=a[i]);return o};
// DB[member][date] = 当日记录（含 actual）
const DB={};let s=31;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
MEMBERS.forEach(([acc],mi)=>{
  const days={};
  const t=obj(TODAY[mi],'2026-11-23');t.actual=theo(t);days[t.date]=t;
  const y=obj(YDAY[mi],'2026-11-22');y.actual=theo(y);days[y.date]=y;
  let close=y.open;
  for(let i=2;i<=30;i++){const dt=new Date(Date.UTC(2026,10,23-i));const ds=dt.toISOString().slice(0,10);
    const k=x=>Math.round(x*(0.5+rnd())/1000)*1000;
    const r={date:ds,open:k(120000),rech:k(700000),add:rnd()<.3?k(10000):0,bAct:k(60000),bRech:k(5000),ded:rnd()<.2?k(5000):0,fee:k(3000)};
    r.profit=k(r.rech*0.35);r.actual=close;
    r.wd=r.open+r.rech+r.add+r.bAct+r.bRech-r.ded-r.fee-r.profit-close;
    if(r.wd<0){r.profit+=r.wd;r.wd=0}
    if(acc==='Playerab9x1123'&&ds==='2026-11-20'){r.bAct=r2(r.bAct+18.8);r.note='11-20 活动彩金多计 18.80 未产生账变（砸金蛋 Free Spin）'}
    days[r.date]=r;close=r.open;
  }
  Object.values(days).forEach(x=>{x.bet=x.profit+Math.round(x.rech*1.8/1000)*1000;x.payout=x.bet-x.profit});
  DB[acc]=days;
});
function agg(acc,d1,d2){
  const ds=Object.values(DB[acc]).filter(r=>r.date>=d1&&r.date<=d2).sort((a,b)=>a.date<b.date?-1:1);
  if(!ds.length)return null;
  const r={acc,days:ds,open:ds[0].open,actual:ds[ds.length-1].actual,notes:ds.filter(x=>x.note).map(x=>x.note)};
  K.slice(1).forEach(k=>r[k]=r2(ds.reduce((a,x)=>a+x[k],0)));
  r.theo=r2(theo(r));return r;
}
let unit='yuan',opened=new Set();
const W=10000;
function fmt(v,sign){v=r2(v);const a=Math.abs(v);const s=unit==='wan'?(a/W).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4})+'万':a.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (v<0?'-':(sign&&v>0?'+':''))+s}
const isBad=r=>Math.abs(r2(r.actual-r.theo))>=0.005;

function process(r){
  const bonus=r.bAct+r.bRech,T=r.theo,diff=r2(r.actual-T),bad=isBad(r);
  const items=[['','① 期初余额',r.open,0,'当日 00:00 余额快照'],['+','② 充值',r.rech,1,'充值记录（成功）'],['+','③ 后台加钱',r.add,1,'修改余额审批 · 加'],['+','④ 彩金',bonus,1,'活动彩金 + 充值彩金',[['活动彩金',r.bAct,'活动费用报表'],['充值彩金',r.bRech,'充值优惠']]],
   ['−','⑤ 提款',r.wd,-1,'提款记录（成功）'],['−','⑥ 后台扣钱',r.ded,-1,'修改余额审批 · 减'],['−','⑦ 手续费',r.fee,-1,'充值/提款手续费'],['+','⑧ GGR',-r.profit,2,'三方游戏报表 · 派彩 − 投注',[['投注',r.bet,'三方游戏报表 · 有效投注'],['派彩',r.payout,'三方游戏报表 · 派彩']]]];
  let run=0;const runs=items.map(it=>run+=it[3]===0?it[2]:it[3]===2?it[2]:it[3]*it[2]);
  const mx=Math.max(...runs,r.open,1);run=0;
  let h=`<div class="formula"><b>${r.acc}</b>：<b>${fmt(T)}</b> = ${fmt(r.open)} <span class="p">+ ${fmt(r.rech)} + ${fmt(r.add)} + ${fmt(bonus)}</span> <span class="m">− ${fmt(r.wd)} − ${fmt(r.ded)} − ${fmt(r.fee)}</span> <span class="${r.profit>0?'m':'p'}">+ (${fmt(-r.profit)})</span>
   <br><span class="src">⑨ 理论余额 = ① + ② + ③ + ④ − ⑤ − ⑥ − ⑦ + ⑧ GGR ；实际 ⑩ = ${fmt(r.actual)} ；差额 = ⑩ − ⑨ = </span><span class="${bad?'dx':'p'}">${fmt(diff,1)}</span></div>
   <table class="steps"><tr><th>运算</th><th class="l">项目</th><th>金额</th><th>累计余额</th><th class="l">走势</th><th class="l">数据来源</th></tr>`;
  items.forEach((it,i)=>{const prev=run;run=runs[i];const sg=it[3]===2?Math.sign(it[2]):it[3];const c=it[3]===0?'#7a9a9a':sg>=0?'#2e9e6a':'#e06055';
    const left=it[3]===0?0:Math.min(prev,run)/mx*100,w=it[3]===0?run/mx*100:Math.abs(run-prev)/mx*100;const cls=it[3]===0?'':sg>=0?'p':'m';
    h+=`<tr><td class="${cls}" style="text-align:center">${it[0]||'—'}</td><td class="l">${it[1]}</td><td class="${cls}">${it[3]===0?fmt(it[2]):it[3]===2?fmt(it[2],1):(it[3]>0?'+':'−')+fmt(it[2])}</td><td>${fmt(run)}</td><td class="l"><div class="wbar"><i style="left:${left}%;width:${Math.max(w,0.6)}%;background:${c}"></i></div></td><td class="l src">${it[4]}</td></tr>`;
    (it[5]||[]).forEach(s=>h+=`<tr class="sub"><td></td><td class="l">　└ ${s[0]}</td><td>${fmt(s[1])}</td><td></td><td></td><td class="l">${s[2]}</td></tr>`);});
  h+=`<tr class="res"><td style="text-align:center">=</td><td class="l">⑨ 理论余额</td><td>${fmt(T)}</td><td>${fmt(T)}</td><td class="l"><div class="wbar"><i style="left:0;width:${T/mx*100}%;background:#1e6e66"></i></div></td><td class="l src">公式结果</td></tr>
   <tr><td></td><td class="l">⑩ 实际余额</td><td>${fmt(r.actual)}</td><td></td><td></td><td class="l src">当日结束余额快照</td></tr>
   <tr><td></td><td class="l">差额</td><td class="${bad?'dx':'p'}">${fmt(diff,1)}</td><td></td><td></td><td class="l src">${bad?'异常':'已对平'}</td></tr></table>`;
  if(r.days&&r.days.length>1){
    h+=`<table class="mt"><tr><th class="l">日期</th><th>① 期初</th><th>② 充值</th><th>③ 后台加钱</th><th>④ 彩金</th><th>⑤ 提款</th><th>⑥ 后台扣钱</th><th>⑦ 手续费</th><th>⑧ 平台盈利</th><th>⑨ 理论余额</th><th>⑩ 实际余额</th><th>差额</th></tr>`;
    r.days.forEach(x=>{const t=r2(theo(x)),d=r2(x.actual-t);h+=`<tr><td class="l">${x.date}</td><td>${fmt(x.open)}</td><td>${fmt(x.rech)}</td><td>${fmt(x.add)}</td><td>${fmt(x.bAct+x.bRech)}</td><td>${fmt(x.wd)}</td><td>${fmt(x.ded)}</td><td>${fmt(x.fee)}</td><td>${fmt(x.profit)}</td><td><b>${fmt(t)}</b></td><td>${fmt(x.actual)}</td><td class="${Math.abs(d)>=.005?'dx':''}">${fmt(d,1)}</td></tr>`});
    h+='</table>';
  }
  return h;
}
function render(){
  let d1=document.getElementById('d1').value;if(d1<'2026-10-24')d1='2026-10-24';if(d1>'2026-11-23')d1='2026-11-23';document.getElementById('d1').value=d1;const d2=d1;
  const q=document.getElementById('q').value.trim().toLowerCase();
  const all=MEMBERS.filter(([a])=>!q||a.toLowerCase().includes(q)).map(([a,n])=>{const r=agg(a,d1,d2);if(r)r.name=n;return r}).filter(Boolean);
  const bad=all.filter(isBad);let rows=document.getElementById('onlyBad').checked?bad:all;
  const T={acc:'合计'};['open','actual',...K.slice(1)].forEach(k=>T[k]=r2(all.reduce((a,r)=>a+r[k],0)));T.theo=r2(theo(T));
  const end=d2==='2026-11-23'?(window._last||'').slice(11)+' 统计':'23:59:59';
  document.getElementById('stat').innerHTML=`会员 ${all.length} 人 <span class="ok">正常 ${all.length-bad.length}</span><span class="bad">异常 ${bad.length}</span>`;
  document.getElementById('warn').innerHTML=`<div class="warn">ⓘ ④ 砸金蛋 Free Spin 道具按「次数 × 单次金额」计入活动彩金，但不产生账变，导致活动费用比偏高、对账出现差额。${bad.length?`<br>⚠ ${bad.length} 位会员差额 ≠ 0：${bad.map(r=>r.acc+' '+fmt(r2(r.actual-r.theo),1)).join('，')}。`:''}</div>`;
  const d=r2(T.actual-T.theo),ok=Math.abs(d)<.005;
  document.getElementById('kpis').innerHTML=all.length?`<div class="kpi"><div class="l">会员期初余额合计</div><div class="v">${fmt(T.open)}</div><div class="s">${d1} 00:00 快照</div></div>
   <div class="kpi"><div class="l">理论余额合计</div><div class="v">${fmt(T.theo)}</div><div class="s" style="line-height:1.6">= 期初余额 + 充值 + 后台加钱 + 彩金 − 提款 − 后台扣钱 − 手续费 + GGR<br><span style="color:#666">= ${fmt(T.open)} + ${fmt(T.rech)} + ${fmt(T.add)} + ${fmt(T.bAct+T.bRech)} − ${fmt(T.wd)} − ${fmt(T.ded)} − ${fmt(T.fee)} + (${fmt(-T.profit)})</span></div></div>
   <div class="kpi"><div class="l">实际余额合计</div><div class="v">${fmt(T.actual)}</div><div class="s">${d2} ${end} 快照</div></div>
   <div class="kpi ${ok?'ok':'bad'}"><div class="l">差额合计</div><div class="v">${fmt(d,1)}</div><div class="s">${ok?'✔ 已对平':'✖ 未对平，涉及 '+bad.length+' 位会员'}</div></div>`:'';
  let h=`<tr><th>会员账号</th><th>① 期初余额<small>当日 00:00</small></th><th>② 充值</th><th>③ 后台加钱</th><th>④ 彩金<small>活动+充值彩金</small></th><th>⑤ 提款</th><th>⑥ 后台扣钱</th><th>⑦ 手续费</th><th>⑧ GGR<small>派彩 − 投注</small></th><th class="calc">⑨ 理论余额<small>①+②+③+④−⑤−⑥−⑦+⑧</small></th><th>⑩ 实际余额<small>当日结束快照</small></th><th>差额<small>⑩ − ⑨</small></th><th>是否正常</th><th>说明</th></tr>`;
  rows.forEach(r=>{const b=isBad(r),df=r2(r.actual-r.theo),o=opened.has(r.acc);
    h+=`<tr class="${b?'abn':''}"><td class="l">${r.acc}<br><span class="src">${r.name?'('+r.name+')':'()'}</span></td><td>${fmt(r.open)}</td><td>${fmt(r.rech)}</td><td>${fmt(r.add)}</td><td>${fmt(r.bAct+r.bRech)}</td><td>${fmt(r.wd)}</td><td>${fmt(r.ded)}</td><td>${fmt(r.fee)}</td><td><span class="${r.profit>0?'m':'p'}">${fmt(-r.profit,1)}</span><br><span class="src" style="font-size:11px">投注 ${fmt(r.bet)}<br>派彩 ${fmt(r.payout)}</span></td><td class="calc"><b>${fmt(r.theo)}</b></td><td>${fmt(r.actual)}</td><td class="${b?'dx':''}">${fmt(df,1)}</td><td><span class="badge ${b?'b-bad':'b-ok'}">${b?'异常':'正常'}</span></td><td class="l" style="white-space:normal;min-width:150px;max-width:220px;font-size:12px">${r.notes.join('；')}</td></tr>`;
  });
  document.getElementById('tbl').innerHTML=h;window._rows=rows;
}
function tog(a){opened.has(a)?opened.delete(a):opened.add(a);render()}

document.querySelectorAll('#quick button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#quick button').forEach(x=>x.classList.remove('on'));b.classList.add('on');d1.value=b.dataset.r;render()});
document.getElementById('onlyBad').onchange=render;
document.getElementById('d1').onchange=()=>{document.querySelectorAll('#quick button').forEach(x=>x.classList.toggle('on',x.dataset.r===d1.value));render()};
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')render()});
function exportCsv(){
  // 导出范围 = 当前筛选条件（日期、会员账号、只看异常）下的全部会员；实际由后端生成文件
  const d1=document.getElementById('d1').value,rows=window._rows||[];
  const head=['日期','会员账号','姓名','期初余额','充值','后台加钱','活动彩金','充值彩金','彩金','提款','后台扣钱','手续费','投注','派彩','GGR','理论余额','实际余额','差额','是否正常','说明'];
  const line=r=>[d1,r.acc,r.name||'',r.open,r.rech,r.add,r.bAct,r.bRech,r2(r.bAct+r.bRech),r.wd,r.ded,r.fee,r.bet,r.payout,-r.profit,r.theo,r.actual,r2(r.actual-r.theo),isBad(r)?'异常':'正常',(r.notes||[]).join('；')];
  const esc=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='﻿'+[head,...rows.map(line)].map(r=>r.map(esc).join(',')).join('\r\n');
  const name=`会员余额对账_${d1}.csv`;const b=document.getElementById('exp');
  const done=t=>{b.textContent=t;setTimeout(()=>b.textContent='导出',1500)};
  if(window.claude&&window.claude.use){ // 在 claude.ai 中打开：通过平台下载能力保存
    window.claude.use('downloads').then(dl=>{if(!dl){done('无法导出');return}
      return dl.save({filename:name,data:csv}).then(()=>done('已导出 ✔'),()=>done('已取消'))}).catch(()=>done('导出失败'));
    return;
  }
  try{const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);done('已导出 ✔')}
  catch(e){done('导出失败')}
}
const REF_MS=30*60*1000;let nextAt=0;
const fmtTime=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`};
function refreshStat(){/* 实际接口：重新拉取会员余额对账数据 */window._last=fmtTime(new Date());render();document.getElementById('lastStat').textContent=window._last;nextAt=Date.now()+REF_MS;tick()}
function tick(){const left=Math.max(0,nextAt-Date.now());if(left===0){refreshStat();return}const m=Math.floor(left/60000),sec=Math.floor(left%60000/1000);document.getElementById('nextRef').textContent=`· ${m}:${String(sec).padStart(2,'0')} 后自动刷新（每 30 分钟）`}
setInterval(()=>{tick();document.getElementById('clock').textContent=fmtTime(new Date()).replace(/-/g,'/')},1000);
refreshStat();
</script>
