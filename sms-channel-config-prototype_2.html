<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>短信营销配置（原型）</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#303133;font-size:12px}
button{font-family:inherit}
.top{background:#1f5fa8;color:#fff;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;font-weight:600}
.top em{color:#ffd04b;font-style:normal}
.stats{background:#2366b0;color:#fff;height:34px;display:flex;align-items:center;gap:18px;padding:0 16px;font-size:13px;font-weight:600;overflow-x:auto;white-space:nowrap}
.stats .y{color:#ffd04b}.stats .g{color:#7ee787}
.badge{display:inline-block;min-width:22px;text-align:center;padding:1px 6px;border-radius:3px;margin-left:4px}
.badge.r{background:#e53935}.badge.gr{background:#43a047}
.layout{display:flex;min-height:calc(100vh - 70px)}
.side{width:160px;flex:none;background:#d9e6f2}
.side .menu{background:#3a8ee6;color:#fff;font-weight:600;font-size:13px;height:42px;display:flex;align-items:center;padding:0 16px}
.side a{display:block;padding:13px 16px;color:#303133;text-decoration:none;border-bottom:1px solid #c9d8e8;font-size:12px}
.side a.on{background:#409eff;color:#fff;font-weight:600}
.side a.sub{padding-left:32px;background:#e9f1f9;border-bottom:0}
.main{flex:1;min-width:0;padding:0 8px 24px}
.crumb{height:34px;display:flex;align-items:center;color:#606266;gap:6px;padding:0 6px}
.tabbar{background:#fff;padding:6px;border:1px solid #ebeef5;margin-bottom:8px}
.tabbar span{display:inline-block;border:1px solid #409eff;color:#409eff;padding:3px 10px;border-radius:2px;background:#ecf5ff}
.panel{background:#fff;border:1px solid #ebeef5;padding:12px}
h3{font-size:14px;margin:4px 0 10px}
table.list{width:100%;border-collapse:collapse}
.list th{background:#fafafa;font-weight:400;color:#606266;border:1px solid #ebeef5;padding:10px;text-align:center}
.list td{border:1px solid #ebeef5;padding:10px;text-align:center}
.list tr.cur td{background:#f5f9ff}
.chip{display:inline-block;padding:2px 8px;border-radius:2px;border:1px solid}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.ok{color:#67c23a}.off{color:#909399}
.lnk{border:0;background:none;color:#409eff;cursor:pointer;font-size:12px;padding:2px 4px}
.lnk.red{color:#f56c6c}
.addch{margin-top:10px;height:28px;padding:0 12px;border:1px dashed #c0c4cc;background:#fff;color:#606266;cursor:pointer;border-radius:3px;font-size:12px}
.addch:hover{color:#409eff;border-color:#409eff}
.cfg-title{margin:28px 0 0;padding-bottom:8px;border-bottom:2px solid #e6a23c;font-size:14px;font-weight:600}
.box{border:1px solid #ebeef5;padding:10px;margin-top:0}
.box-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:13px}
.sw{position:relative;width:34px;height:18px;border-radius:9px;border:0;cursor:pointer;padding:0;background:#dcdfe6;vertical-align:middle}
.sw[aria-checked="true"]{background:#13ce66}
.sw span{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"] span{left:18px}
.swl{margin-left:6px;font-weight:400}
.form{width:100%;border-collapse:collapse}
.form th{width:128px;background:#fafafa;font-weight:400;color:#606266;border:1px solid #ebeef5;padding:8px;text-align:center}
.form td{border:1px solid #ebeef5;padding:5px 8px}
.inp{width:100%;height:28px;border:1px solid #dcdfe6;border-radius:3px;padding:0 10px;font-size:12px;color:#303133;background:#fff;font-family:inherit}
.inp:focus{outline:none;border-color:#409eff}
.hint{margin-top:4px;color:#909399}
.cols{display:grid;grid-template-columns:1fr;gap:20px;margin-top:14px}
@media(max-width:1000px){.cols{grid-template-columns:1fr}.side{display:none}}
.op{font-weight:600;font-size:13px;margin:0 0 8px}
.op i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.acc-head{background:#f5f7fa;border:1px solid #ebeef5;border-bottom:0;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:#606266}
.acc-head b{color:#303133}
.tag{margin-left:8px;padding:1px 6px;border-radius:2px;background:#ecf5ff;color:#409eff}
.tag.bak{background:#f4f4f5;color:#909399}
.add{margin-top:10px;width:100%;height:30px;border:1px dashed #c0c4cc;background:#fff;color:#409eff;cursor:pointer;border-radius:3px;font-size:12px}
.add:hover{border-color:#409eff;background:#ecf5ff}
.sum{margin-top:6px;color:#909399;text-align:right}
.actions{margin-top:12px;display:flex;gap:8px;align-items:center}
.btn{height:30px;padding:0 16px;border:1px solid #dcdfe6;border-radius:3px;background:#fff;cursor:pointer;font-size:12px;color:#606266}
.btn.primary{background:#409eff;border-color:#409eff;color:#fff}
.btn.primary:hover{background:#66b1ff}
.msg{color:#67c23a}.msg.err{color:#f56c6c}
.confirm{color:#f56c6c}
.empty{padding:40px;text-align:center;color:#909399}
.op-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.op-head .op{margin:0}
.mode{display:flex;align-items:center;gap:12px;color:#606266;flex-wrap:wrap}
.mode label{display:flex;align-items:center;gap:4px;cursor:pointer;color:#303133}
.mode .inp{width:220px}
section.disabled .tbox,section.disabled .add{opacity:.5}
tr.unused td{color:#c0c4cc}
tr.unused td.sw-cell .swl.ok{color:#67c23a}
.tbox{overflow-x:auto}
table.acc{min-width:720px}
.acc th,.acc td{padding:8px 6px;font-size:12px;word-break:break-all}
.nowrap{white-space:nowrap}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:10vh;z-index:10}
.mask[hidden]{display:none}
.dialog{background:#fff;width:520px;max-width:calc(100vw - 24px);border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.2)}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:14px;font-weight:600;border-bottom:1px solid #ebeef5}
.x{border:0;background:none;font-size:20px;line-height:1;color:#909399;cursor:pointer;padding:0 4px}
.d-body{padding:14px 18px}
.d-err{color:#f56c6c;margin-top:8px;min-height:16px}
.d-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 16px}
.req{color:#f56c6c;margin-right:2px}
</style>
</head>
<body>
<div class="top"><span>当前时间: <em id="clock"></em></span><span>简体中文　bd_johnny ▾</span></div>
<div class="stats">
  <span>在线人数: <span style="color:#ff8a80">28</span></span><span>当日注册: <span class="y">23</span></span>
  <span>实名认证-待处理: <span class="g">0</span></span><span>当日充值成功: <span class="y">19</span></span>
  <span>充值:<span class="badge r">0</span></span><span>提款:<span class="badge gr">0</span></span>
  <span>提款超时(&gt;10分):<span class="badge r">7</span></span><span>风控审核:<span class="badge gr">0</span></span>
  <span>风控超时(&gt;30分):<span class="badge r">0</span></span><span>预算告警:<span class="badge r">1</span></span>
</div>
<div class="layout">
  <nav class="side" aria-label="菜单">
    <div class="menu">菜单 ☰</div>
    <a href="#">财务管理</a><a href="#">实物奖品管理</a><a href="#">提现管理</a><a href="#">数据报表</a>
    <a href="#">平台概况</a><a href="#">游戏管理</a><a href="#">公告管理</a><a href="#">充值配置</a>
    <a href="#">日志管理</a><a href="#">活动配置</a><a href="#">代理结算</a><a href="#">系统管理</a>
    <a href="#">营销管理</a><a href="#" class="on">▸ 短信营销配置</a><a href="#" class="sub">促销活动</a><a href="#" class="sub">谷歌关键词管理</a>
  </nav>
  <div class="main">
    <div class="crumb">位置 › 营销管理 › 短信营销配置</div>
    <div class="tabbar"><span>短信营销配置 ×</span></div>
    <div class="panel">
      <h3>渠道 → 用途</h3>
      <table class="list">
        <thead><tr><th>发送渠道</th><th>用途</th><th>任务</th><th>渠道状态</th><th style="width:180px">操作</th></tr></thead>
        <tbody id="chRows"></tbody>
      </table>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <button class="addch" id="addCh">＋ 新增渠道</button>
        <button class="lnk" id="resetAll" style="margin-top:10px;color:#909399">重置为初始数据</button>
      </div>

      <div id="cfg"></div>
    </div>
  </div>
</div>

<div class="mask" id="modal" hidden>
  <form class="dialog" id="mForm" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="d-head"><span id="mTitle">编辑账号</span><button type="button" class="x" id="mClose" aria-label="关闭">×</button></div>
    <div class="d-body"><table class="form"><tbody id="mBody"></tbody></table><div class="d-err" id="mErr"></div></div>
    <div class="d-foot"><button type="button" class="btn" id="mCancel">取消</button><button type="submit" class="btn primary">确定</button></div>
  </form>
</div>

<script>
const COLORS = [['#e6a23c', '#fdf6ec'], ['#409eff', '#ecf5ff'], ['#67c23a', '#f0f9eb'], ['#909399', '#f4f4f5'], ['#f56c6c', '#fef0f0']];
const OPERATORS = ['Globe', 'Smart', 'DITO'];
let accSeq = 100;
// 每个账号 = 一套 SMPP 配置 + 所属运营商
const acc = (operator, host = '', port = '', systemId = '', sessionCount = 1, windowSize = 10, sourceAddr = '', passwordSet = false) =>
  ({ id: accSeq++, operator, host, port, systemId, sessionCount, windowSize, sourceAddr, passwordSet, enabled: true });
let channels = [
  { id: 1, name: '渠道 A', usage: '待分配', task: '—', on: true, color: 0, accounts: [
    acc('Globe', 'smpp-otp.m360.com.ph', '2074', '', 1, 10, 'PLAY789', true),
    acc('Smart', 'smpp.m360.com.ph', '2614', '', 10, 10, '789BingoVip', true) ] },
  { id: 2, name: '渠道 B', usage: '奖励金到账（非充值类）', task: 'AgentActivitySmppJob', on: true, color: 1, accounts: [] },
  { id: 3, name: '渠道C', usage: '营销短信', task: 'MarketingSmsJob、T3SMPPJob', on: true, color: 2, accounts: [] }
];
let nextId = 4, curId = 1, draft = null, msg = null;

// 持久化：保存在浏览器本地，刷新后保留
const STORE_KEY = 'sms-channel-config-prototype-v6';
const DEFAULTS = JSON.parse(JSON.stringify({ channels, nextId, accSeq }));
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ channels, nextId, curId, accSeq })); } catch (e) {}
}
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved && Array.isArray(saved.channels)) {
    channels = saved.channels; nextId = saved.nextId || 4; accSeq = saved.accSeq || 1000;
    curId = channels.some(c => c.id === saved.curId) ? saved.curId : (channels[0] ? channels[0].id : null);
  }
} catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const isOn = a => a.enabled !== false;

function select(id) { curId = id; draft = id ? clone(channels.find(c => c.id === id)) : null; msg = null; persist(); renderAll(); }

function renderList() {
  $('#chRows').innerHTML = channels.map(c => {
    const [fg, bg] = COLORS[c.color % COLORS.length];
    return `<tr class="${c.id === curId ? 'cur' : ''}">
      <td><span class="chip" style="color:${fg};background:${bg};border-color:${fg}55">${esc(c.name)}</span></td>
      <td>${esc(c.usage)}</td><td class="mono">${esc(c.task)}</td>
      <td><button class="sw" role="switch" aria-checked="${c.on}" aria-label="${esc(c.name)} 开关" data-act="chToggle" data-id="${c.id}"><span></span></button><span class="swl ${c.on ? 'ok' : 'off'}">${c.on ? '开启' : '关闭'}</span></td>
      <td><button class="lnk" data-act="edit" data-id="${c.id}">${c.id === curId ? '配置中' : '配置'}</button></td></tr>`;
  }).join('') || '<tr><td colspan="5" class="empty">暂无渠道，点击「新增渠道」添加</td></tr>';
}

function accountsHtml() {
  const list = draft.accounts;
  const rows = list.map((a, i) => {
    const sw = `<button class="sw" role="switch" aria-checked="${isOn(a)}" aria-label="账号 ${i + 1} 开关" data-act="accToggle" data-i="${i}"><span></span></button><span class="swl ${isOn(a) ? 'ok' : 'off'}">${isOn(a) ? '开启' : '关闭'}</span>`;
    return `<tr class="${isOn(a) ? '' : 'unused'}"><td>${i + 1}</td><td class="nowrap sw-cell">${sw}</td><td>${esc(a.operator)}</td><td>${esc(a.host)}</td><td>${esc(a.port)}</td><td>${esc(a.systemId)}</td>
      <td>${a.passwordSet ? '******' : ''}</td><td>${esc(a.sessionCount)}</td><td>${esc(a.windowSize)}</td><td>${esc(a.sourceAddr)}</td>
      <td class="nowrap"><button class="lnk" data-act="accEdit" data-i="${i}">编辑</button></td></tr>`;
  }).join('') || '<tr><td colspan="11" class="empty" style="padding:20px">暂无账号，点击「添加账号」</td></tr>';
  // 只在异常时提示：某个已配置的运营商账号全部关闭
  const offOps = OPERATORS.filter(o => list.some(a => a.operator === o) && !list.some(a => a.operator === o && isOn(a)));
  const hint = offOps.length ? `${offOps.join('、')} 的账号都已关闭，不会通过 ${offOps.join('、')} 发送短信。` : '';
  return `${hint ? `<div class="hint" style="margin:0 0 8px;color:#e6a23c">${hint}</div>` : ''}
    <div class="tbox"><table class="list acc">
      <thead><tr><th>#</th><th>状态</th><th>运营商</th><th>host</th><th>port</th><th>systemId</th><th>password</th><th>sessionCount</th><th>windowSize</th><th>sourceAddr</th><th>操作</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <button class="add" data-act="accAdd">＋ 添加账号</button>`;
}

function renderCfg() {
  if (!draft) { $('#cfg').innerHTML = '<div class="cfg-title">当前配置：—</div><div class="empty">在上方列表点击「配置」选择一个渠道</div>'; return; }
  const d = draft;
  $('#cfg').innerHTML = `
    <div class="cfg-title">当前配置：${esc(d.name)} –</div>
    <div class="box">
      <div class="box-head"><span>${esc(d.name)}</span></div>
      <table class="form">
        <tr><th>渠道名称</th><td><input class="inp" data-k="name" value="${esc(d.name)}"></td></tr>
        <tr><th>用途</th><td><input class="inp" data-k="usage" value="${esc(d.usage)}"></td></tr>
        <tr><th>任务</th><td><input class="inp" data-k="task" value="${esc(d.task)}"></td></tr>
      </table>
      <div style="margin-top:14px">${accountsHtml()}</div>
    </div>
    <div class="actions">
      <button class="btn primary" data-act="save">保存</button>
      <button class="btn" data-act="reset">取消修改</button>
      ${msg ? `<span class="msg ${msg.err ? 'err' : ''}">${msg.text}</span>` : ''}
    </div>`;
}

function renderAll() { renderList(); renderCfg(); }
function setMsg(text, err) { msg = text ? { text, err } : null; const m = document.querySelector('.actions .msg'); if (m && !msg) m.remove(); }

// 渠道列表
$('#chRows').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = +b.dataset.id;
  if (b.dataset.act === 'edit') select(id);
  if (b.dataset.act === 'chToggle') {
    const c = channels.find(x => x.id === id); c.on = !c.on;
    if (draft && draft.id === id) draft.on = c.on;
    persist(); renderList();
  }
});
$('#addCh').addEventListener('click', () => {
  const id = nextId++;
  channels.push({ id, name: '新渠道 ' + id, usage: '', task: '', on: false, color: id - 1, accounts: [] });
  select(id);
  const n = $('#cfg [data-k="name"]'); n.focus(); n.select();
});

// 渠道配置
$('#cfg').addEventListener('input', e => {
  const t = e.target, k = t.dataset.k; if (!k) return;
  draft[k] = t.value; setMsg(null);
});
$('#cfg').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'accAdd') { openModal(-1); return; }
  if (a === 'accEdit') { openModal(+b.dataset.i); return; }
  if (a === 'accToggle') {
    // 账号开关即时生效，不需要点保存
    const i = +b.dataset.i, acct = draft.accounts[i];
    acct.enabled = !isOn(acct);
    const saved = channels.find(c => c.id === curId);
    const twin = saved && saved.accounts.find(x => x.id === acct.id);
    if (twin) { twin.enabled = acct.enabled; persist(); }
    msg = twin ? { text: `账号 ${i + 1} 已${acct.enabled ? '开启' : '关闭'}（即时生效）` } : { text: '新账号的开关在点击「保存」后生效' };
    renderCfg(); return;
  }
  if (a === 'reset') { select(curId); return; }
  if (a === 'save') {
    if (!draft.name.trim()) { msg = { text: '渠道名称不能为空', err: true }; renderCfg(); return; }
    const i = channels.findIndex(c => c.id === curId);
    channels[i] = clone(draft);
    persist();
    msg = { text: '已保存（保存在本浏览器，刷新后保留）' };
    renderAll(); return;
  }
});

// 账号弹框
const FIELDS = [
  ['operator', '运营商', 'select', true],
  ['host', 'host', 'text', true], ['port', 'port', 'text', true], ['systemId', 'systemId', 'text', true],
  ['password', 'password', 'password', false], ['sessionCount', 'sessionCount', 'number', true],
  ['windowSize', 'windowSize', 'number', true], ['sourceAddr', 'sourceAddr', 'text', false]
];
let modalIdx = null;
function openModal(i) {
  modalIdx = i;
  const list = draft.accounts;
  const last = list[list.length - 1];
  const a = i >= 0 ? list[i] : { operator: '', host: last ? last.host : '', port: last ? last.port : '', systemId: '',
    sessionCount: last ? last.sessionCount : 1, windowSize: last ? last.windowSize : 10, sourceAddr: last ? last.sourceAddr : '' };
  $('#mTitle').textContent = i >= 0 ? '编辑账号 ' + (i + 1) : '添加账号';
  $('#mBody').innerHTML = FIELDS.map(([k, label, type, req]) => {
    let input;
    if (type === 'select') {
      input = `<select class="inp" name="${k}"><option value=""${a.operator ? '' : ' selected'} disabled>请选择</option>${OPERATORS.map(o => `<option${o === a.operator ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
    } else {
      const isPwd = k === 'password';
      const ph = isPwd && i >= 0 && a.passwordSet ? '不修改请留空' : '';
      input = `<input class="inp" type="${type}" name="${k}" value="${isPwd ? '' : esc(a[k])}" placeholder="${ph}" autocomplete="${isPwd ? 'new-password' : 'off'}"${type === 'number' ? ' min="1"' : ''}>`;
    }
    return `<tr><th>${req ? '<span class="req">*</span>' : ''}${label}</th><td>${input}</td></tr>`;
  }).join('');
  $('#mErr').textContent = '';
  $('#modal').hidden = false;
  $('#mBody [name="' + (i >= 0 ? 'operator' : 'systemId') + '"]').focus();
}
function closeModal() { $('#modal').hidden = true; modalIdx = null; }
$('#mCancel').addEventListener('click', closeModal);
$('#mClose').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
$('#mForm').addEventListener('submit', e => {
  e.preventDefault();
  const i = modalIdx, list = draft.accounts;
  const v = Object.fromEntries(FIELDS.map(([k]) => [k, $('#mBody [name="' + k + '"]').value.trim()]));
  const missing = FIELDS.filter(([k, , , req]) => req && !v[k]).map(([, l]) => l);
  if (i < 0 && !v.password) missing.push('password');
  if (missing.length) { $('#mErr').textContent = '请填写：' + missing.join('、'); return; }
  const old = i >= 0 ? list[i] : { id: accSeq++, enabled: true };
  const next = { id: old.id, operator: v.operator, host: v.host, port: v.port, systemId: v.systemId, sessionCount: v.sessionCount, windowSize: v.windowSize,
    sourceAddr: v.sourceAddr, passwordSet: !!(v.password || old.passwordSet), enabled: old.enabled !== false };
  if (i >= 0) list[i] = next; else list.push(next);
  closeModal();
  msg = { text: '账号已' + (i >= 0 ? '修改' : '添加') + '，点击「保存」生效' };
  renderCfg();
});

(function tick() { const d = new Date(), p = n => String(n).padStart(2, '0'); $('#clock').textContent = `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; setTimeout(tick, 1000); })();
$('#resetAll').addEventListener('click', e => {
  const b = e.target;
  if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = '确认重置？再点一次'; b.style.color = '#f56c6c'; return; }
  const d = clone(DEFAULTS); channels = d.channels; nextId = d.nextId; accSeq = d.accSeq;
  b.dataset.confirm = ''; b.textContent = '重置为初始数据'; b.style.color = '#909399';
  select(channels[0].id);
});
select(curId);
</script>
</body>
